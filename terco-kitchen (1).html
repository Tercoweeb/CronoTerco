/* ════════════════════════ ROOT / RESET ════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --r:#ce0000; --g:#139b20; --y:#d4840a;
  --n:#000; --n1:#111; --n2:#1a1a1a; --n3:#242424; --n4:#2e2e2e;
  --cr:#fff2d2; --cr2:rgba(255,242,210,.7); --cr3:rgba(255,242,210,.35); --cr4:rgba(255,242,210,.12);
  --ff:'NuformSans','Arial Black',sans-serif;
  --fh:'HenriettaC','Georgia',serif;
  --tr:.18s ease;
  --rad:12px;
  /* dynamic theme vars (overridden by JS for yellow/red thresholds) */
  --col-fresh:var(--g); --col-warn:var(--y); --col-done:var(--r);
}
html{font-size:16px;height:100%}
body{font-family:var(--ff);background:var(--n1);color:var(--cr);min-height:100%;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:var(--ff);cursor:pointer;border:none;outline:none;background:none}
button:focus-visible{outline:2px solid var(--r);outline-offset:2px}
input,select{font-family:var(--ff)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--n2)}
::-webkit-scrollbar-thumb{background:rgba(255,242,210,.15);border-radius:3px}

/* ════════════════════════ LAYOUT ════════════════════════ */
#app{display:flex;flex-direction:column;min-height:100dvh}
.topbar{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:12px;
  background:var(--n);border-bottom:2px solid var(--r);
  padding:0 16px;height:60px;position:sticky;top:0;z-index:90;flex-shrink:0;
}
.topbar__left{display:flex;align-items:center;gap:14px}
.topbar__right{display:flex;align-items:center;gap:8px;justify-content:flex-end}
/* logo is now an img asset */
.clock{font-size:clamp(.9rem,2vw,1.25rem);font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums;color:rgba(255,242,210,.55)}
.stat-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--n2);border:1.5px solid var(--cr4);border-radius:7px;
  padding:5px 10px;font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  white-space:nowrap;
}
.stat-pill.hot{border-color:rgba(206,0,0,.4)}
.stat-pill__n{font-size:.95rem;color:var(--r);font-size:1.05rem}
.icon-btn{
  width:38px;height:38px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--cr3);background:var(--n2);border:1.5px solid var(--cr4);
  font-size:1rem;transition:all var(--tr);
}
.icon-btn:hover{color:var(--cr);border-color:var(--cr3);background:var(--n3)}
.icon-btn.active{color:var(--r);border-color:var(--r);background:rgba(206,0,0,.1)}

/* NEXT UP BANNER */
.next-banner{
  display:none;background:rgba(212,132,10,.15);border-bottom:2px solid rgba(212,132,10,.45);
  padding:8px 16px;font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
  color:#d4840a;align-items:center;gap:8px;
}
.next-banner.visible{display:flex}

/* GRID */
.grid{
  flex:1;padding:16px;
  display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  align-content:start;
}
@media(max-width:480px){.grid{padding:10px;gap:10px;grid-template-columns:1fr}}

/* ADD CARD */
.add-card{
  min-height:160px;background:transparent;
  border:2px dashed var(--cr4);border-radius:var(--rad);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;color:var(--cr4);font-size:.72rem;font-weight:900;
  text-transform:uppercase;letter-spacing:.12em;
  transition:all var(--tr);width:100%;
}
.add-card:hover{border-color:var(--r);color:var(--r);background:rgba(206,0,0,.04)}
.add-card svg{width:28px;height:28px;opacity:.5}
.add-card:hover svg{opacity:1}

/* ════════════════════════ GROUP CARD ════════════════════════ */
.gcard{
  background:var(--n2);border:2px solid var(--cr4);
  border-radius:var(--rad);overflow:hidden;
  transition:border-color .3s,box-shadow .3s;
  display:flex;flex-direction:column;
}
.gcard.fresh  {border-color:rgba(19,155,32,.5)}
.gcard.warn   {border-color:rgba(212,132,10,.6)}
.gcard.urgent {border-color:rgba(206,0,0,.7)}
.gcard.done   {border-color:var(--r);animation:card-pulse .7s ease-in-out infinite alternate}
.gcard.paused {border-color:rgba(100,100,255,.4)}
.gcard.accepted{border-color:var(--g);opacity:.6;transition:opacity 1s}
@keyframes card-pulse{
  from{box-shadow:0 0 0 2px rgba(206,0,0,.2),0 0 20px rgba(206,0,0,.1)}
  to  {box-shadow:0 0 0 5px rgba(206,0,0,.45),0 0 50px rgba(206,0,0,.25)}
}

.gcard__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px 8px;border-bottom:1px solid var(--cr4);gap:8px;
}
.gcard__num{font-weight:900;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,242,210,.7)}
.gcard__entry{font-size:.6rem;font-weight:700;color:rgba(255,242,210,.3);letter-spacing:.06em}
.gcard__status{
  font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  padding:3px 9px;border-radius:5px;background:rgba(255,242,210,.09);color:rgba(255,242,210,.5);flex-shrink:0;
}
.gcard__status.fresh  {background:rgba(19,155,32,.15);color:var(--g)}
.gcard__status.warn   {background:rgba(212,132,10,.15);color:#d4840a}
.gcard__status.urgent {background:rgba(206,0,0,.2);color:var(--r)}
.gcard__status.done   {background:var(--r);color:var(--cr);animation:blink .5s infinite}
.gcard__status.paused {background:rgba(100,100,255,.15);color:#8888ff}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

/* TIMER SECTION */
.gcard__timer{
  display:flex;align-items:center;justify-content:center;gap:16px;
  padding:14px 12px 6px;
}
.ring-wrap{position:relative;flex-shrink:0}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,242,210,.06);stroke-width:5}
.ring-fg{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.ring-text{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:clamp(1.4rem,4vw,1.9rem);font-weight:900;letter-spacing:.04em;
  font-variant-numeric:tabular-nums;line-height:1;
}
.timer-adj{display:flex;flex-direction:column;gap:4px}
.adj-btn{
  background:var(--n3);border:1px solid rgba(255,242,210,.12);color:rgba(255,242,210,.6);
  border-radius:6px;padding:5px 10px;font-size:.58rem;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;transition:all .12s;white-space:nowrap;
}
.adj-btn:hover{background:var(--n4);color:var(--cr);border-color:var(--cr3)}
.adj-btn.minus:hover{border-color:var(--r);color:var(--r);background:rgba(206,0,0,.1)}

/* PROGRESS BAR */
.prog-wrap{padding:0 12px 4px}
.prog-bar{height:3px;background:var(--cr4);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;border-radius:2px;transition:width 1s linear,background .3s}

/* ITEMS LIST */
.gcard__items{padding:8px 12px 4px;flex:1}
.items-empty{font-size:.6rem;font-weight:700;color:var(--cr4);text-transform:uppercase;letter-spacing:.1em;text-align:center;padding:6px 0}
.item-row{display:flex;align-items:center;gap:7px;padding:4px 0;border-bottom:1px solid rgba(255,242,210,.04)}
.item-row:last-child{border-bottom:none}
.item-thumb{width:30px;height:30px;border-radius:5px;object-fit:cover;flex-shrink:0;border:1px solid var(--cr4)}
.item-info{flex:1;min-width:0}
.item-name{font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.04em;color:var(--cr);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:.56rem;font-weight:700;color:rgba(255,242,210,.5);margin-top:1px}
.item-qty-badge{
  font-size:.75rem;font-weight:900;padding:4px 10px;border-radius:5px;flex-shrink:0;
  background:rgba(255,242,210,.1);color:var(--cr);letter-spacing:.04em;
  border:1px solid rgba(255,242,210,.12);
}

/* CARD FOOTER */
.gcard__foot{
  display:flex;gap:6px;padding:8px 12px 10px;flex-wrap:wrap;border-top:1px solid var(--cr4);
}
.fc-btn{
  flex:1;min-width:60px;border-radius:7px;padding:7px 6px;
  font-size:.58rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;
  border:1.5px solid transparent;transition:all .15s;text-align:center;
}
.fc-primary{background:var(--r);color:var(--cr);border-color:var(--r)}
.fc-primary:hover{background:#a50000;border-color:#a50000}
.fc-green {background:var(--g);color:var(--cr);border-color:var(--g)}
.fc-green:hover{background:#0f8019;border-color:#0f8019;animation:none}
.fc-ghost {background:var(--n3);color:rgba(255,242,210,.68);border-color:rgba(255,242,210,.16)}
.fc-ghost:hover{background:var(--n4);color:var(--cr);border-color:rgba(255,242,210,.4)}
.fc-danger{background:rgba(206,0,0,.1);color:var(--r);border-color:rgba(206,0,0,.25)}
.fc-danger:hover{background:rgba(206,0,0,.2)}
.fc-accept{
  width:100%;flex:unset;min-width:unset;
  background:var(--g);color:var(--cr);border-color:var(--g);font-size:.65rem;
  animation:pulse-g 1s infinite;
}
@keyframes pulse-g{
  0%,100%{box-shadow:0 0 0 0 rgba(19,155,32,.4)}
  50%     {box-shadow:0 0 0 6px rgba(19,155,32,0)}
}
.fc-accept:hover{background:#0f8019;animation:none}
.fc-pause{background:rgba(100,100,255,.1);color:#8888ff;border-color:rgba(100,100,255,.25)}

/* ALARM FLASH */
#alarm-flash{
  display:none;position:fixed;inset:0;pointer-events:none;z-index:49;
  animation:fl 0.7s infinite alternate;
}
#alarm-flash.on{display:block}
@keyframes fl{from{background:rgba(206,0,0,.03)}to{background:rgba(206,0,0,.11)}}

/* ════════════════════════ MODAL ════════════════════════ */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);
  z-index:200;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
.sheet{
  background:#111;border:2px solid var(--cr4);border-bottom:none;
  border-radius:18px 18px 0 0;width:100%;max-width:700px;
  max-height:92dvh;display:flex;flex-direction:column;
  animation:sup .25s cubic-bezier(.22,.61,.36,1);
}
@keyframes sup{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet__head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 18px 12px;border-bottom:1px solid var(--cr4);flex-shrink:0;
}
.sheet__title{font-weight:900;font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}
.sheet__close{background:var(--n3);color:var(--cr);border-radius:7px;padding:4px 12px;font-size:1rem;border:1px solid var(--cr4)}
.sheet__close:hover{background:rgba(206,0,0,.2);color:var(--r);border-color:var(--r)}

/* DURATION PICKER */
.dur-pick{padding:12px 18px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-shrink:0;border-bottom:1px solid var(--cr4)}
.dur-label{font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--cr3);margin-right:4px}
.dur-disp{
  font-size:1.2rem;font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums;
  color:var(--cr);background:var(--n3);border-radius:7px;padding:5px 14px;border:1.5px solid var(--cr4);min-width:80px;text-align:center;
}
.dur-btn{
  background:var(--n3);border:1px solid var(--cr4);color:var(--cr2);
  border-radius:6px;padding:5px 8px;font-size:.58rem;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;transition:all .12s;
}
.dur-btn:hover{background:var(--n4);color:var(--cr)}
.dur-btn.minus:hover{border-color:var(--r);color:var(--r)}
.dur-btn.plus:hover{border-color:var(--g);color:var(--g)}

/* TYPE TOGGLE */
.type-tog{display:flex;gap:0;margin:10px 18px 6px;background:rgba(255,242,210,.05);border-radius:8px;padding:3px;flex-shrink:0}
.type-btn{flex:1;padding:7px 10px;border-radius:6px;font-weight:900;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cr3);background:transparent;transition:all .15s}
.type-btn.active{background:var(--r);color:var(--cr)}

/* PIZZA GRID */
.pz-grid{padding:0 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;overflow-y:auto;flex:1}
.pz-opt{
  background:var(--n3);border:2px solid var(--cr4);border-radius:10px;overflow:hidden;
  cursor:pointer;transition:all .15s;position:relative;
}
.pz-opt:hover{border-color:rgba(255,242,210,.25)}
.pz-opt.sel{border-color:var(--r);background:rgba(206,0,0,.12)}
.pz-opt__img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pz-opt__body{padding:6px 7px}
.pz-opt__name{font-weight:900;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--cr);line-height:1.2}
.pz-opt__qty{
  display:flex;align-items:center;gap:6px;margin-top:5px;
  background:rgba(255,242,210,.04);border-radius:6px;padding:3px 5px;
}
.pz-qty-btn{
  width:22px;height:22px;border-radius:4px;background:rgba(255,242,210,.1);color:var(--cr);
  font-size:.9rem;font-weight:900;display:flex;align-items:center;justify-content:center;line-height:1;
  transition:background .12s;
}
.pz-qty-btn:hover{background:rgba(206,0,0,.3)}
.pz-qty-num{font-weight:900;font-size:.8rem;color:var(--cr);min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.pz-badges{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.pz-badge{font-size:.42rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:1px 4px;border-radius:3px}
.pb-best{background:rgba(206,0,0,.2);color:var(--r)}
.pb-spicy{background:rgba(255,100,0,.2);color:#f60}
.pb-veg{background:rgba(19,155,32,.2);color:var(--g)}
.pb-new{background:rgba(100,100,255,.2);color:#88f}
.sel-check{
  position:absolute;top:5px;right:5px;
  width:20px;height:20px;border-radius:50%;background:var(--r);
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;color:var(--cr);opacity:0;transition:opacity .15s;
}
.pz-opt.sel .sel-check{opacity:1}

/* MODAL CONFIRM BTN */
.sheet__confirm{
  margin:8px 18px 18px;padding:13px;background:var(--r);color:var(--cr);
  border-radius:9px;font-weight:900;font-size:.75rem;text-transform:uppercase;
  letter-spacing:.1em;width:calc(100% - 36px);transition:background .15s,transform .1s;flex-shrink:0;
}
.sheet__confirm:hover{background:#a50000}
.sheet__confirm:active{transform:scale(.98)}
.sheet__confirm:disabled{opacity:.3;cursor:not-allowed}

/* ════════════════════════ SETTINGS PANEL ════════════════════════ */
.settings-panel{
  position:fixed;top:0;right:0;bottom:0;width:min(360px,100vw);
  background:#111;border-left:2px solid var(--cr4);z-index:300;
  display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);
}
.settings-panel.open{transform:translateX(0)}
.sp-head{padding:16px 18px;border-bottom:1px solid var(--cr4);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sp-title{font-weight:900;font-size:.85rem;text-transform:uppercase;letter-spacing:.12em}
.sp-close{background:var(--n3);color:var(--cr);border-radius:7px;padding:5px 12px;font-size:.9rem;border:1px solid var(--cr4)}
.sp-body{flex:1;overflow-y:auto;padding:16px 18px}
.sp-group{margin-bottom:20px}
.sp-group-label{font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:.14em;color:var(--cr3);border-bottom:1px solid var(--cr4);padding-bottom:6px;margin-bottom:10px}
.sp-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:12px}
.sp-row label{font-size:.7rem;font-weight:700;color:var(--cr2)}
.toggle{
  position:relative;width:40px;height:22px;flex-shrink:0;
  background:var(--n4);border-radius:11px;border:1.5px solid var(--cr4);cursor:pointer;transition:background .2s;
}
.toggle.on{background:var(--r);border-color:var(--r)}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;
  border-radius:50%;background:var(--cr);transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.toggle.on::after{transform:translateX(18px)}
.sp-input{
  background:var(--n3);border:1.5px solid var(--cr4);color:var(--cr);
  border-radius:7px;padding:6px 10px;font-family:var(--ff);font-weight:900;font-size:.8rem;
  width:90px;text-align:center;
}
.sp-input:focus{border-color:var(--r);outline:none}
.slider-wrap{flex:1;display:flex;align-items:center;gap:8px}
.sp-slider{
  flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;
  background:var(--n4);outline:none;cursor:pointer;
}
.sp-slider::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--r);cursor:pointer;box-shadow:0 0 0 3px rgba(206,0,0,.2);
}
.sp-slider-val{font-size:.7rem;font-weight:900;color:var(--cr3);min-width:28px;text-align:right}
.color-row{display:flex;gap:8px;margin-top:4px}
.color-opt{
  flex:1;padding:8px 4px;border-radius:7px;border:2px solid var(--cr4);
  font-size:.58rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;
  text-align:center;cursor:pointer;transition:all .15s;
}

/* ════════════════════════ HISTORY ════════════════════════ */
.history-panel{
  position:fixed;top:0;left:0;bottom:0;width:min(340px,100vw);
  background:#111;border-right:2px solid var(--cr4);z-index:300;
  display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,.61,.36,1);
}
.history-panel.open{transform:translateX(0)}
.hp-item{padding:10px 14px;border-bottom:1px solid var(--cr4)}
.hp-time{font-size:.58rem;color:var(--cr3);font-weight:700;letter-spacing:.06em}
.hp-items{font-size:.65rem;color:var(--cr2);font-weight:700;margin-top:3px}
.hp-dur{font-size:.58rem;color:var(--g);font-weight:900;letter-spacing:.06em;margin-top:2px}
.hp-empty{padding:20px 14px;font-size:.65rem;color:var(--cr3);font-weight:700;text-transform:uppercase;letter-spacing:.1em}

/* ════════════════════════ TOASTS ════════════════════════ */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  background:rgba(26,26,26,.95);border:1.5px solid var(--cr4);border-radius:8px;
  padding:8px 18px;font-size:.65rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;
  color:var(--cr2);backdrop-filter:blur(8px);animation:toast-in .25s ease;white-space:nowrap;
}
@keyframes toast-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════ RESPONSIVE ════════════════════════ */
@media(max-width:580px){
  .topbar{padding:0 10px;height:52px}
  .stat-pill{padding:4px 7px;font-size:.56rem}
  .stat-pill__n{font-size:.85rem}
  .clock{font-size:.9rem}
  .sp-head,.history-panel .sp-head{padding:12px 14px}
  .pz-grid{grid-template-columns:repeat(2,1fr)}
}

/* ── BIG OVEN TOTALS BAR ────────────────────────────────────────── */
.oven-totals {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0;
  background: #0a0a0a;
  border-bottom: 1px solid rgba(255,242,210,.06);
  padding: 14px 20px;
}
.ot-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 0 32px;
  flex: 1;
  max-width: 180px;
}
.ot-num {
  font-size: clamp(2.2rem, 5vw, 3.5rem);
  font-weight: 900;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--r);
  transition: color .3s, transform .2s;
  letter-spacing: .04em;
}
.ot-num.bump {
  animation: ot-bump .3s ease;
}
@keyframes ot-bump {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.2); color: #ff4444; }
  100% { transform: scale(1); }
}
.ot-label {
  font-size: clamp(.55rem, 1.2vw, .65rem);
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: rgba(255,242,210,.35);
  text-align: center;
  line-height: 1.4;
}
.ot-divider {
  width: 1px;
  height: 48px;
  background: rgba(255,242,210,.07);
  flex-shrink: 0;
}
@media (max-width: 480px) {
  .oven-totals { padding: 10px 8px; }
  .ot-item { padding: 0 16px; }
  .ot-num { font-size: 1.9rem; }
}

</style>
</head>
<body>
<div id="alarm-flash"></div>

<div id="app">
  <!-- ══ TOP BAR ══ -->
  <header class="topbar">

/* ════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════ */
let groups = [];
let history = [];
let gCounter = 0;
let tickId = null;
let warnedGroups = new Set(); // ids that already got 30s warning sound

const SETTINGS = {
  defaultDuration: 120,
  volume: 0.7,
  soundEnabled: true,
  vibrationEnabled: true,
  confirmDelete: false,
  showSeconds: true,
  sortByRemaining: true,
  // thresholds (% remaining)
  warnPct: 40,   // go yellow below 40%
  urgentPct: 15, // go red below 15%
};

let ui = {
  modalOpen: false,
  settingsOpen: false,
  historyOpen: false,
  editGroupId: null, // null = new group
};

// Modal temp state
let mItems = []; // {pizzaId, type, qty}
let mDuration = 120;
let mItemType = 'slice';

/* ════════════════════════════════════════════════════════
   AUDIO
   ════════════════════════════════════════════════════════ */
let AudioCtx = null;
function getACtx() {
  if (!AudioCtx) AudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return AudioCtx;
}

let alarmLoop = null;
function playTone(freq, dur, vol=0.2, type='square', delay=0) {
  if (!SETTINGS.soundEnabled) return;
  try {
    const ctx = getACtx();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.value = freq; osc.type = type;
    const t = ctx.currentTime + delay;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol * SETTINGS.volume, t + 0.02);
    g.gain.linearRampToValueAtTime(0, t + dur - 0.02);
    osc.start(t); osc.stop(t + dur);
  } catch(e) {}
}
function playWarn() {
  // Gentle double-beep for 30s warning
  playTone(660, 0.12, 0.15, 'sine', 0);
  playTone(880, 0.12, 0.15, 'sine', 0.18);
}
function playAlarm() {
  // Urgent 4-tone alarm
  [0, 0.18, 0.36, 0.54].forEach((d, i) => playTone(i%2?660:880, 0.14, 0.22, 'square', d));
}
function startAlarmLoop() {
  stopAlarmLoop();
  playAlarm();
  alarmLoop = setInterval(playAlarm, 1200);
  document.getElementById('alarm-flash').classList.add('on');
  if (SETTINGS.vibrationEnabled && navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
}
function stopAlarmLoop() {
  clearInterval(alarmLoop); alarmLoop = null;
  document.getElementById('alarm-flash').classList.remove('on');
}
function checkAlarms() {
  const hasDone = groups.some(g => g.status === 'done');
  if (!hasDone) stopAlarmLoop();
}

/* ════════════════════════════════════════════════════════
   TICK
   ════════════════════════════════════════════════════════ */
function ensureTick() {
  if (tickId) return;
  tickId = setInterval(tick, 1000);
}
function tick() {
  let changed = false;
  groups.forEach(g => {
    if (g.status !== 'running') return;
    g.remaining = Math.max(0, g.remaining - 1);
    changed = true;
    // 30s warning
    if (g.remaining === 30 && !warnedGroups.has(g.id)) {
      warnedGroups.add(g.id);
      playWarn();
      toast('⚠ 30 segundos — Grupo #' + g.num);
    }
    if (g.remaining === 0) {
      g.status = 'done';
      startAlarmLoop();
    }
  });
  if (changed) render();
  updateClock();
}
function updateClock() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  const s = now.getSeconds().toString().padStart(2,'0');
  document.getElementById('clk').textContent = h + ':' + m + (SETTINGS.showSeconds ? ':' + s : '');
}

/* ════════════════════════════════════════════════════════
   GROUPS CRUD
   ════════════════════════════════════════════════════════ */
function createGroup(items, duration) {
  gCounter++;
  const g = {
    id: gCounter,
    num: gCounter,
    items: items.map(i => ({...i})),
    totalTime: duration,
    remaining: duration,
    status: 'running', // idle|running|paused|done|accepted
    startTime: new Date(),
    paused: false,
  };
  groups.push(g);
  ensureTick();
  render();
  return g;
}

function deleteGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  if (SETTINGS.confirmDelete && g.status !== 'done') {
    if (!confirm('¿Eliminar este grupo del horno?')) return;
  }
  groups = groups.filter(x => x.id !== id);
  warnedGroups.delete(id);
  checkAlarms();
  render();
  toast('Grupo eliminado');
}

function acceptGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  // Add to history
  history.unshift({
    num: g.num,
    items: g.items,
    startTime: g.startTime,
    duration: g.totalTime,
    finishedAt: new Date(),
  });
  if (history.length > 20) history.pop();
  groups = groups.filter(x => x.id !== id);
  warnedGroups.delete(id);
  checkAlarms();
  render();
  renderHistory();
  toast('✓ Grupo #' + g.num + ' sacado del horno');
}

function pauseGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  if (g.status === 'running') {
    g.status = 'paused';
    toast('Grupo #' + g.num + ' en pausa');
  } else if (g.status === 'paused') {
    g.status = 'running';
    toast('Grupo #' + g.num + ' reanudado');
  }
  render();
}

function resetGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  g.remaining = g.totalTime;
  if (g.status === 'done') {
    g.status = 'running';
    checkAlarms();
  }
  warnedGroups.delete(id);
  render();
  toast('Cronómetro reiniciado');
}

function adjGroupTime(id, delta) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  g.remaining = Math.max(5, Math.min(600, g.remaining + delta));
  g.totalTime = Math.max(g.totalTime, g.remaining); // ensure bar doesn't glitch
  render();
}

function duplicateGroup(id) {
  const g = groups.find(x => x.id === id);
  if (!g) return;
  createGroup(g.items, g.totalTime);
  toast('Grupo duplicado');
}

/* ════════════════════════════════════════════════════════
   MODAL
   ════════════════════════════════════════════════════════ */
function openAddModal() {
  mItems = [];
  mDuration = SETTINGS.defaultDuration;
  mItemType = 'slice';
  ui.modalOpen = true;
  document.getElementById('t-slice').classList.add('active');
  document.getElementById('t-pizza').classList.remove('active');
  document.getElementById('modal-title').textContent = 'Añadir al Horno';
  document.getElementById('modal').classList.add('open');
  updateDurDisp();
  renderPzGrid();
  updateModalBtn();
}
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  ui.modalOpen = false;
}
function setItemType(t) {
  mItemType = t;
  document.getElementById('t-slice').classList.toggle('active', t==='slice');
  document.getElementById('t-pizza').classList.toggle('active', t==='pizza');
  renderPzGrid();
}
function adjDur(d) {
  mDuration = Math.max(15, Math.min(600, mDuration + d));
  updateDurDisp();
}
function updateDurDisp() {
  document.getElementById('dur-disp').textContent = fmt(mDuration);
}
function setPzQty(pizzaId, delta) {
  const existing = mItems.find(i => i.pizzaId === pizzaId && i.type === mItemType);
  if (existing) {
    existing.qty = Math.max(0, existing.qty + delta);
    if (existing.qty === 0) mItems = mItems.filter(i => !(i.pizzaId===pizzaId&&i.type===mItemType));
  } else if (delta > 0) {
    mItems.push({pizzaId, type: mItemType, qty: 1});
  }
  renderPzGrid();
  updateModalBtn();
}
function updateModalBtn() {
  const btn = document.getElementById('modal-ok');
  const total = mItems.reduce((a,i)=>a+i.qty,0);
  btn.disabled = total === 0;
  btn.textContent = total > 0
    ? `▶ Iniciar — ${total} ítem${total>1?'s':''} (${fmt(mDuration)})`
    : '▶ Iniciar en el horno';
}
function confirmModal() {
  if (!mItems.length) return;
  createGroup(mItems, mDuration);
  closeModal();
  toast('Grupo #' + gCounter + ' en el horno 🔥');
}

function renderPzGrid() {
  const grid = document.getElementById('pz-grid');
  grid.innerHTML = PIZZAS.map(p => {
    const item = mItems.find(i => i.pizzaId===p.id && i.type===mItemType);
    const qty = item ? item.qty : 0;
    const sel = qty > 0;
    const img = PHOTOS[p.photo] || '';
    const badges = [
      p.best  ? '<span class="pz-badge pb-best">★ Best</span>' : '',
      p.spicy ? '<span class="pz-badge pb-spicy">🌶</span>' : '',
      p.veg   ? '<span class="pz-badge pb-veg">V</span>' : '',
      p.new_  ? '<span class="pz-badge pb-new">✦ New</span>' : '',
    ].filter(Boolean).join('');
    return `<div class="pz-opt${sel?' sel':''}" onclick="setPzQty('${p.id}',1)">
      <div class="sel-check">✓</div>
      <img class="pz-opt__img" src="${img}" alt="${p.name}" loading="lazy">
      <div class="pz-opt__body">
        <div class="pz-opt__name">${p.name}</div>
        ${badges ? `<div class="pz-badges">${badges}</div>` : ''}
        <div class="pz-opt__qty" onclick="event.stopPropagation()">
          <button class="pz-qty-btn" onclick="setPzQty('${p.id}',-1)">−</button>
          <span class="pz-qty-num">${qty}</span>
          <button class="pz-qty-btn" onclick="setPzQty('${p.id}',1)">+</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════
   RENDER GROUPS
   ════════════════════════════════════════════════════════ */
function statusOf(g) {
  if (g.status === 'done') return 'done';
  if (g.status === 'paused') return 'paused';
  if (g.status !== 'running') return 'idle';
  const pct = g.remaining / g.totalTime * 100;
  if (pct <= SETTINGS.urgentPct) return 'urgent';
  if (pct <= SETTINGS.warnPct)   return 'warn';
  return 'fresh';
}

function statusLabel(s) {
  return {idle:'En espera',fresh:'En horno 🟢',warn:'Pronto 🟡',urgent:'¡Urgente! 🔴',done:'¡LISTO!',paused:'Pausado',accepted:'Entregado'}[s] || s;
}

function ringColor(s) {
  return {fresh:'#139b20',warn:'#d4840a',urgent:'#ce0000',done:'#ce0000',paused:'#8888ff',idle:'rgba(255,242,210,.12)'}[s] || '#fff2d2';
}

function renderGroup(g) {
  const s = statusOf(g);
  const pct = Math.min(1, g.remaining / g.totalTime);
  const r = 44, circ = 2 * Math.PI * r;
  const dash = circ * pct;
  const dashOff = circ - dash;
  const color = ringColor(s);
  const entryTime = g.startTime ? g.startTime.getHours().toString().padStart(2,'0') + ':' + g.startTime.getMinutes().toString().padStart(2,'0') : '';
  const timerColor = {done:'var(--r)',warn:'#d4840a',urgent:'var(--r)',fresh:'var(--cr)',paused:'#8888ff',idle:'rgba(255,242,210,.25)'}[s];

  const itemsHtml = g.items.length === 0 ? '<div class="items-empty">Sin items</div>' : g.items.map(item => {
    const p = PIZZAS.find(x=>x.id===item.pizzaId);
    if (!p) return '';
    const img = PHOTOS[p.photo]||'';
    return `<div class="item-row">
      <img class="item-thumb" src="${img}" alt="${p.name}" loading="lazy">
      <div class="item-info">
        <div class="item-name">${p.name}</div>
        <div class="item-sub">${item.type==='slice'?'Slice':'Entera 18"'}</div>
      </div>
      <span class="item-qty-badge">×${item.qty}</span>
    </div>`;
  }).join('');

  let footHtml = '';
  if (s === 'done') {
    footHtml = `<button class="fc-btn fc-accept" onclick="acceptGroup(${g.id})">✓ SACAR DEL HORNO</button>`;
  } else {
    footHtml = `
      <button class="fc-btn fc-ghost adj-btn minus" onclick="adjGroupTime(${g.id},-15)" title="-15s">−15s</button>
      <button class="fc-btn fc-ghost adj-btn plus" onclick="adjGroupTime(${g.id},30)" title="+30s">+30s</button>
      <button class="fc-btn ${s==='paused'?'fc-pause':g.status==='running'?'fc-primary':'fc-ghost'}" onclick="pauseGroup(${g.id})">
        ${g.status==='running'?'⏸ Pausa':g.status==='paused'?'▶ Reanudar':'▶ Iniciar'}
      </button>
      <button class="fc-btn fc-ghost" onclick="resetGroup(${g.id})" title="Reiniciar">↺</button>
      <button class="fc-btn fc-ghost" onclick="duplicateGroup(${g.id})" title="Duplicar">⊕</button>
      <button class="fc-btn fc-danger" onclick="deleteGroup(${g.id})" title="Eliminar">🗑</button>
    `;
  }

  const el = document.createElement('div');
  el.className = `gcard ${s}`;
  el.id = `g${g.id}`;
  el.innerHTML = `
    <div class="gcard__head">
      <span class="gcard__num">Grupo #${g.num}</span>
      <span class="gcard__entry">Entró ${entryTime}</span>
      <span class="gcard__status ${s}">${statusLabel(s)}</span>
    </div>
    <div class="gcard__timer">
      <div class="ring-wrap">
        <svg width="96" height="96" viewBox="0 0 96 96">
          <circle class="ring-bg" cx="48" cy="48" r="44"/>
          <circle class="ring-fg" cx="48" cy="48" r="44"
            stroke="${color}"
            stroke-dasharray="${circ.toFixed(2)}"
            stroke-dashoffset="${dashOff.toFixed(2)}"/>
        </svg>
        <div class="ring-text" style="color:${timerColor}">${fmt(g.remaining)}</div>
      </div>
      <div class="timer-adj">
        <button class="adj-btn minus" onclick="adjGroupTime(${g.id},-30)">−30s</button>
        <button class="adj-btn minus" onclick="adjGroupTime(${g.id},-15)">−15s</button>
        <button class="adj-btn plus" onclick="adjGroupTime(${g.id},15)">+15s</button>
        <button class="adj-btn plus" onclick="adjGroupTime(${g.id},30)">+30s</button>
        <button class="adj-btn plus" onclick="adjGroupTime(${g.id},60)">+1m</button>
      </div>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" style="width:${(pct*100).toFixed(1)}%;background:${color}"></div></div>
    </div>
    <div class="gcard__items">${itemsHtml}</div>
    <div class="gcard__foot">${footHtml}</div>
  `;
  return el;
}

function render() {
  updateStats();
  updateNextBanner();

  const grid = document.getElementById('grid');
  let addBtn = document.getElementById('add-btn');

  // Clear existing cards (not the add button)
  Array.from(grid.children).forEach(el => {
    if (el.id !== 'add-btn') el.remove();
  });

  if (!addBtn) {
    addBtn = document.createElement('button');
    addBtn.id = 'add-btn';
    addBtn.className = 'add-card';
    addBtn.onclick = openAddModal;
    addBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>Nuevo Grupo`;
    grid.appendChild(addBtn);
  }

  // Sort groups
  let sorted = [...groups];
  if (SETTINGS.sortByRemaining) {
    sorted.sort((a,b) => {
      // done first, then by remaining ascending
      if (a.status==='done' && b.status!=='done') return -1;
      if (b.status==='done' && a.status!=='done') return 1;
      return a.remaining - b.remaining;
    });
  }

  sorted.forEach(g => {
    const card = renderGroup(g);
    grid.insertBefore(card, addBtn);
  });
}

let _prevSlices = -1, _prevPizzas = -1;
function updateStats() {
  let slices=0, pizzas=0;
  groups.filter(g=>g.status==='running'||g.status==='done'||g.status==='paused').forEach(g=>{
    g.items.forEach(i=>{
      if(i.type==='slice') slices+=i.qty;
      else pizzas+=i.qty;
    });
  });
  // Header mini-stats
  document.getElementById('tot-slices').textContent = slices;
  document.getElementById('tot-pizzas').textContent = pizzas;
  document.getElementById('tot-groups').textContent = groups.length;
  // Big counter bar
  const ns = document.getElementById('ot-slices-n');
  const np = document.getElementById('ot-pizzas-n');
  const ng = document.getElementById('ot-groups-n');
  if (ns) {
    ns.textContent = slices;
    np.textContent = pizzas;
    ng.textContent = groups.filter(g=>g.status==='running'||g.status==='paused'||g.status==='done').length;
    // Animate number when it changes
    if (slices !== _prevSlices) { ns.classList.remove('bump'); void ns.offsetWidth; ns.classList.add('bump'); }
    if (pizzas !== _prevPizzas) { np.classList.remove('bump'); void np.offsetWidth; np.classList.add('bump'); }
    _prevSlices = slices; _prevPizzas = pizzas;
  }
}

function updateNextBanner() {
  const banner = document.getElementById('next-banner');
  const running = groups.filter(g=>g.status==='running').sort((a,b)=>a.remaining-b.remaining);
  if (running.length === 0) { banner.classList.remove('visible'); return; }
  const next = running[0];
  document.getElementById('next-text').textContent = `Grupo #${next.num} en ${fmt(next.remaining)}`;
  banner.classList.add('visible');
}

/* ════════════════════════════════════════════════════════
   HISTORY
   ════════════════════════════════════════════════════════ */
function toggleHistory() {
  ui.historyOpen = !ui.historyOpen;
  document.getElementById('hp').classList.toggle('open', ui.historyOpen);
  document.getElementById('hist-btn').classList.toggle('active', ui.historyOpen);
  renderHistory();
}
function renderHistory() {
  const body = document.getElementById('hp-body');
  if (history.length === 0) {
    body.innerHTML = '<div class="hp-empty">Sin historial todavía</div>';
    return;
  }
  body.innerHTML = history.map(h => {
    const items = h.items.map(i => {
      const p = PIZZAS.find(x=>x.id===i.pizzaId);
      return `${i.qty}× ${p?p.name:i.pizzaId} (${i.type==='slice'?'slice':'entera'})`;
    }).join(', ');
    const t = h.finishedAt;
    const ts = t.getHours().toString().padStart(2,'0')+':'+t.getMinutes().toString().padStart(2,'0');
    return `<div class="hp-item">
      <div class="hp-time">Grupo #${h.num} — ${ts}</div>
      <div class="hp-items">${items}</div>
      <div class="hp-dur">⏱ ${fmt(h.duration)}</div>
    </div>`;
  }).join('');
}

/* ════════════════════════════════════════════════════════
   FULLSCREEN
   ════════════════════════════════════════════════════════ */
function toggleFull() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(()=>{});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  document.getElementById('full-btn').classList.toggle('active', !!document.fullscreenElement);
});

/* ════════════════════════════════════════════════════════
   TOASTS
   ════════════════════════════════════════════════════════ */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.style.opacity='0', 2200);
  setTimeout(() => t.remove(), 2500);
}

/* ════════════════════════════════════════════════════════
   KEYBOARD
   ════════════════════════════════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'n' || e.key === 'N') openAddModal();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  if (e.key === 'h' || e.key === 'H') toggleHistory();
  if (e.key === 'Escape') {
    closeModal();
    if (ui.settingsOpen) toggleSettings();
    if (ui.historyOpen) toggleHistory();
  }
});

/* ════════════════════════════════════════════════════════
   UTILS
   ════════════════════════════════════════════════════════ */
function fmt(sec) {
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m + ':' + s;
}

   INIT
